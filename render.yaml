# Render web service. Secrets stay in the Render dashboard (sync: false). Do not commit key values.
services:
  - type: web
    name: couplesync
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "wendevNoReply <noreply@wendev.site>"
      - key: CONTACT_EMAIL
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_AUTH_ENABLED
        value: "false"
    disk:
      name: couplesync-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
